name: 每日论文筛选

on:
  schedule:
    # UTC 01:30，对应美西下午 6:30 / 美东晚上 9:30，arXiv 发完当天列表之后。
    # 周二到周六跑（对应美东周一到周五的发布）。
    # 注意：GitHub 的 cron 不是精确触发，高峰期可能延迟十几分钟，属正常现象。
    - cron: "30 1 * * 2-6"
  # 允许在 Actions 页面手动点按钮跑一次，第一次配置完用这个验证
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑流水线
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/main.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "今天没有变化，不提交"
          else
            git commit -m "每日更新 $(date -u +%Y-%m-%d)"
            git push
          fi
